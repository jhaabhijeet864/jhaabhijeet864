<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 45" width="100%" height="45" fill="none">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: 600;
      fill: #58a6ff;
      text-anchor: middle;
      opacity: 0;
      animation: cycle 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .t1 { animation-delay: 0s; }
    .t2 { animation-delay: 3s; }
    .t3 { animation-delay: 6s; }
    .t4 { animation-delay: 9s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      6% { opacity: 1; transform: translateY(0); }
      25% { opacity: 1; transform: translateY(0); }
      31% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
  </style>
  <text x="50%" y="30" class="title t1">Entrepreneur</text>
  <text x="50%" y="30" class="title t2">Co-Founder &amp; Chief AIML Engineer</text>
  <text x="50%" y="30" class="title t3">Architecting Agentic Systems</text>
  <text x="50%" y="30" class="title t4">Building KrocPDF</text>
</svg>
